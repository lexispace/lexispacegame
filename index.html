<!DOCTYPE html>
<html>
<head>
    <title>Lexispace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f7fa;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        #target {
            margin-top: 5px;
        }

        #remaining {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin: 10px auto 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #wordInput {
            width: 260px;
            padding: 12px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            margin: 6px 3px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        #message {
            min-height: 24px;
            margin: 15px;
        }

        #solverResult {
            min-height: 24px;
            margin: 15px;
            font-weight: bold;
        }

        #wordList {
            list-style-position: inside;
            padding: 0;
        }
    </style>
</head>

<body>
    <h1>Lexispace v0.4.4</h1>

    <p>Target:</p>
    <h2 id="target">HAPPINESS</h2>

    <p>Remaining letters:</p>
    <h2 id="remaining">HAPPINESS</h2>

    <input id="wordInput" type="text" placeholder="Enter a word">

    <div>
        <button onclick="addWord()">Add</button>
        <button onclick="shuffleLetters()">Shuffle</button>
        <button onclick="solvePuzzle()">Solve</button>
        <button onclick="newPuzzle()">New Puzzle</button>
    </div>

    <p id="message"></p>
    <p id="solverResult"></p>

    <h3>Words played:</h3>
    <ul id="wordList"></ul>

    <script src="game.js"></script>
</body>
</html>
