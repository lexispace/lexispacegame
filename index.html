<!DOCTYPE html>
<html>
<head>
    <title>Lexispace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f7fa;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        #target {
            margin-top: 5px;
        }

        #remaining {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin: 10px auto 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #wordInput {
            width: 260px;
            padding: 12px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            margin: 6px 3px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        #message {
            min-height: 24px;
            margin: 15px;
        }

        #solverResult {
            min-height: 24px;
            margin: 15px;
            font-weight: bold;
        }

        #wordList {
            list-style-position: inside;
            padding: 0;
        }
        #equivFinderPanel {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 240px;
    padding: 16px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    text-align: left;
}

#equivFinderInput {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
}

#equivFinderResult {
    max-height: 45vh;
    overflow-y: auto;
    overflow-wrap: anywhere;
}

@media (max-width: 1000px) {
    #equivFinderPanel {
        position: static;
        width: auto;
        max-width: 500px;
        margin: 30px auto;
    }
}
    </style>
</head>

<body>
    <h1>Lexispace v0.5</h1>

    <p id="puzzleNumber">Puzzle #1</p>

<p>Target:</p>
<h2 id="target">A</h2>

    <p>Remaining letters:</p>
    <h2 id="remaining">HAPPINESS</h2>

    <input id="wordInput" type="text" placeholder="Enter a word">

    <div>
        <button onclick="addWord()">Add</button>
        <button onclick="shuffleLetters()">Shuffle</button>
        <button onclick="solvePuzzle()">Solve</button>
        <button onclick="newPuzzle()">New Puzzle</button>
    </div>

    <p id="message"></p>
    <p id="solverResult"></p>

    <h3>Words played:</h3>
    <ul id="wordList"></ul>
    <aside id="equivFinderPanel">
    <h3>Dev: Equivalence Finder</h3>
    <input id="equivFinderInput" type="text" placeholder="Enter any string">
    <select id="equivFinderSort">
    <option value="alphabetical">Alphabetical</option>
    <option value="length">By length</option>
</select>
    <button onclick="equivFinder(document.getElementById('equivFinderInput').value)">Find equivalents</button>
    <p id="equivFinderResult" aria-live="polite"></p>
</aside>
    <script src="game.js"></script>
</body>
</html>
